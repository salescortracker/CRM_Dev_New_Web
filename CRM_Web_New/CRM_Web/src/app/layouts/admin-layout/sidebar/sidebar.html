<aside class="crm-sidebar d-flex flex-column" [class.collapsed]="isCollapsed">
  <div class="brand d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <span class="brand-icon d-inline-flex align-items-center justify-content-center">
        <i class="fa-solid fa-chart-line"></i>
      </span>
      <span class="brand-title" *ngIf="!isCollapsed">CRM System</span>
    </div>
    <button class="btn sidebar-toggle" type="button" (click)="toggleSidebar()"
      [title]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
  </div>

  <nav class="sidebar-scroll flex-grow-1">
    <div class="menu-section" *ngFor="let group of menuGroups">
      <div class="menu-heading" *ngIf="!isCollapsed">{{ group.heading }}</div>

      <div *ngFor="let menu of group.menus">

        <!-- Parent -->

        <a class="menu-link d-flex align-items-center justify-content-between" (click)="toggleMenu(menu)"
          [routerLink]="menu.route || null" routerLinkActive="active" [title]="menu.label">

          <div class="d-flex align-items-center gap-2">

            <i class="fa-solid menu-icon" [ngClass]="menu.icon"></i>

            <span *ngIf="!isCollapsed">
              {{menu.label}}
            </span>

          </div>

          <i *ngIf="menu.children && !isCollapsed" class="fa-solid"
            [ngClass]="menu.expanded ? 'fa-chevron-down' : 'fa-chevron-right'">
          </i>

        </a>

        <!-- Children -->

        <div *ngIf="menu.children && menu.expanded && !isCollapsed" class="submenu">

          <a *ngFor="let child of menu.children" class="submenu-link" [routerLink]="child.route">

            <i class="fa-solid" [ngClass]="child.icon"></i>

            {{child.label}}

          </a>

        </div>

      </div>
    </div>
  </nav>
</aside>
