<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h4>Company Master</h4>

        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Company Name</label>
                    <input class="form-control"
                           [(ngModel)]="company.companyName">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Company Code</label>
                    <input class="form-control"
                           [(ngModel)]="company.companyCode">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Industry</label>
                    <input class="form-control"
                           [(ngModel)]="company.industryType">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Headquarters</label>
                    <input class="form-control"
                           [(ngModel)]="company.headquarters">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Email</label>
                    <input class="form-control"
                           [(ngModel)]="company.companyEmail">
                </div>

                <div class="col-md-4 mb-3">
                    <label>Contact</label>
                    <input class="form-control"
                           [(ngModel)]="company.companyContact">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Address</label>
                    <textarea class="form-control"
                              [(ngModel)]="company.companyAddress"></textarea>
                </div>

                <div class="col-md-3 mb-3">
                    <label>Plan Start</label>
                    <input type="date"
                           class="form-control"
                           [(ngModel)]="company.planStartDate">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Expiry Date</label>
                    <input type="date"
                           class="form-control"
                           [(ngModel)]="company.expiryDate">
                </div>

                <div class="col-md-3">

                    <label>

                        <input type="checkbox"
                               [(ngModel)]="company.isActive">

                        Active

                    </label>

                </div>

            </div>

            <button
                class="btn btn-danger me-2"
                (click)="saveCompany()">

                {{isEdit?'Update':'Save'}}

            </button>

            <button
                class="btn btn-secondary"
                (click)="clear()">

                Clear

            </button>

        </div>

    </div>

    <br>

    <table class="table table-bordered table-hover">

        <thead class="table-danger">

            <tr>

                <th>#</th>

                <th>Name</th>

                <th>Code</th>

                <th>Industry</th>

                <th>Email</th>

                <th>Contact</th>

                <th>Status</th>

                <th width="150">Action</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let item of companies; let i=index">

                <td>{{i+1}}</td>

                <td>{{item.companyName}}</td>

                <td>{{item.companyCode}}</td>

                <td>{{item.industryType}}</td>

                <td>{{item.companyEmail}}</td>

                <td>{{item.companyContact}}</td>

                <td>

                    {{item.isActive?'Active':'Inactive'}}

                </td>

                <td>

                    <button
                        class="btn btn-warning btn-sm me-2"
                        (click)="edit(item.companyId)">

                        Edit

                    </button>

                    <button
                        class="btn btn-danger btn-sm"
                        (click)="delete(item.companyId)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
